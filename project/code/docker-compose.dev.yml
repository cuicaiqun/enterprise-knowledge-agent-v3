# Local development overlay — publishes datastore ports to the host and
# relaxes the production secret gate so .env.example weak defaults can run.
#
# Usage (from code/):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file python/.env up
#
# api / ingest-worker use network_mode: host so they share the host's egress
# (needed when Clash/Mihomo TUN blocks Docker bridge → public HTTPS).
# Datastores stay on the compose bridge; host-networked services reach them
# via the published localhost ports below.

services:
  neo4j:
    ports:
      - "7474:7474"
      - "7687:7687"

  chromadb:
    ports:
      - "8000:8000"

  postgres:
    ports:
      - "5433:5432"

  redis:
    # Host already often has Redis on 6379; publish compose Redis on 6380.
    # Containers still talk to redis:6379 via the Docker network.
    ports:
      - "6380:6379"

  kafka:
    ports:
      - "29092:29092"
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  api:
    # Host network: LLM egress follows host (Clash TUN OK); ignore bridge DNS names.
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      APP_ENV: development
      REQUIRE_STRONG_SECRETS: "false"
      CHROMA_HOST: 127.0.0.1
      CHROMA_PORT: "8000"
      NEO4J_URI: bolt://127.0.0.1:7687
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:29092
      STATE_STORE_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@127.0.0.1:5433/${POSTGRES_DB:-knowledge}
      PGVECTOR_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@127.0.0.1:5433/${POSTGRES_DB:-knowledge}
      REDIS_URL: redis://127.0.0.1:6380/0
      # Many OpenAI-compatible chat gateways lack /embeddings; use local text2vec.
      EMBEDDING_BACKEND: local
    user: "0:0"
    volumes:
      - ./python:/app
      - uploads:/app/uploads
      - auth_data:/app/data

  ingest-worker:
    network_mode: host
    networks: !reset []
    environment:
      APP_ENV: development
      REQUIRE_STRONG_SECRETS: "false"
      CHROMA_HOST: 127.0.0.1
      CHROMA_PORT: "8000"
      NEO4J_URI: bolt://127.0.0.1:7687
      STATE_STORE_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@127.0.0.1:5433/${POSTGRES_DB:-knowledge}
      PGVECTOR_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@127.0.0.1:5433/${POSTGRES_DB:-knowledge}
      REDIS_URL: redis://127.0.0.1:6380/0
      EMBEDDING_BACKEND: local
    user: "0:0"
    volumes:
      - ./python:/app
      - uploads:/app/uploads
      - auth_data:/app/data
