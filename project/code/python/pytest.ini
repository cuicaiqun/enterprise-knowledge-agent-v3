[pytest]
asyncio_mode = auto
timeout = 60
timeout_method = thread
testpaths = tests
python_files = test_*.py
addopts = -q --tb=short
markers =
    neo4j_e2e: real Neo4j dual-tenant E2E (requires RUN_NEO4J_E2E=1)
    storage_e2e: real Chroma/Neo4j fault-injection E2E (requires RUN_STORAGE_E2E=1)
    neo4j_readonly_e2e: real Neo4j reader-role E2E (requires RUN_NEO4J_READONLY_E2E=1)
    mvp_e2e: live API upload→ingest→QA (requires RUN_MVP_E2E=1)
filterwarnings =
    ignore::DeprecationWarning
